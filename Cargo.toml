[package]
name = "mitm-transformer"
version = "1.1.0"
edition = "2024"
license = "Apache-2.0"
description = "MitM transformation-layer scheduled batch job"
homepage = "https://github.com/Zheng-Bote/mitm_transformation_main"
repository = "https://github.com/Zheng-Bote/mitm_transformation_main"
documentation = "https://github.com/Zheng-Bote/mitm_transformation_main/tree/main/docs"
keywords = ["mitm-2", "transformation-layer"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "json"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
rand = "0.8"
